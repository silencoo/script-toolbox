server {
    # Example TLS paths; replace them before enabling this server.
    listen 443 ssl;
    server_name pwa.example.com;
    ssl_certificate /etc/letsencrypt/live/pwa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwa.example.com/privkey.pem;
    location / {
        allow 203.0.113.10; # Whitelist another IP
        deny all; # Deny everyone else
        proxy_ssl_server_name on;
        proxy_pass https://upstream.example.com;
        proxy_set_header Host upstream.example.com;
        #proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "https://upstream.example.com";
        proxy_set_header Accept-Encoding "";
        # 处理 HTML 页面中的跳转
        sub_filter_once off;
        proxy_set_header Accept-Encoding "identity";
        sub_filter_types text/html text/plain text/xml application/xhtml+xml;
        sub_filter 'action="https://upstream.example.com/passcode"' 'action="/passcode"';
        sub_filter 'window.location.href = "https://upstream.example.com' 'window.location.href = "/"';
        sub_filter 'window.location.replace("https://upstream.example.com' 'window.location.replace("/")';
        sub_filter 'content="https://upstream.example.com' 'content="/"';
        sub_filter 'https://upstream.example.com' 'https://pwa.example.com';
        sub_filter 'href="#"' 'href="javascript:void(0)"';
        add_header Cache-Control "no-cache, must-revalidate, max-age=30";
        # 防止 CSP 限制
        proxy_hide_header Content-Security-Policy;
        # Inject PWA manifest link and meta tags for iOS
        sub_filter '</head>' '<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.json">\n<meta name="theme-color" content="#ffffff">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">\n</head>';
        # Inject Service Worker registration script before the closing </body> tag
        sub_filter '</body>' '<script>\n  if ("serviceWorker" in navigator) {\n    navigator.serviceWorker.register("/service-worker.js");\n  }\n</script>\n</body>';
    }
    # 处理表单提交，避免跳出代理
    location /passcode {
        proxy_pass https://upstream.example.com/passcode;
        proxy_set_header Accept-Encoding "identity";
        sub_filter_types text/html text/plain text/xml application/xhtml+xml;
        proxy_ssl_server_name on;
        proxy_set_header Host upstream.example.com;
        #proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect https://upstream.example.com/ /;
        proxy_set_header Accept-Encoding "";
        # 拦截 /login 页面上的 JavaScript 跳转
        sub_filter_once off;
        sub_filter 'window.location.href = "https://upstream.example.com' 'window.location.href = "/"';
        sub_filter 'window.location.replace("https://upstream.example.com' 'window.location.replace("/")';
        sub_filter 'action="https://upstream.example.com/passcode"' 'action="/passcode"';
        sub_filter 'https://upstream.example.com' 'https://pwa.example.com';
    }
    location /search {
        proxy_set_header Accept-Encoding "";
        proxy_pass https://upstream.example.com/search;
        proxy_ssl_server_name on;
        proxy_set_header Host upstream.example.com;
        #proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'https://upstream.example.com' 'https://pwa.example.com';
    }
    # 处理 3xx 跳转，防止跳出代理
    proxy_redirect https://upstream.example.com/ /;
    location /manifest.json {
        root /var/www/pwa-site;
    }
    location /service-worker.js {
        root /var/www/pwa-site;
    }
    location /icons/ {
        root /var/www/pwa-site;
    }
    access_log /var/log/nginx/pwa.example.com/access.log main;
}
server {
    listen 80;
    server_name pwa.example.com;
    return 301 https://$host$request_uri;
}
