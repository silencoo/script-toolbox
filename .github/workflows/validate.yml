name: Validate scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Linux · full repository and agent suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -not -path './userscripts/sht-helper/src/modules/*' -print0 | xargs -0 -n1 node --check
      - name: Validate Cookie Exporter extension
        run: |
          npm ci
          npm run validate
        working-directory: extensions/cookie-exporter
      - name: Test JPopSuki Autobrr toolkit
        run: node --test jpopsuki-rss-autobrr/tests/userscript.test.cjs
      - name: Test Gemini Toolkit
        run: node --test userscripts/gemini-toolkit/tests/*.test.cjs
      - name: Test NodeSeek enhancer
        run: node --test userscripts/nodeseek/tests/*.test.mjs
      - name: Validate SHT Helper
        run: |
          npm ci
          npm run check
        working-directory: userscripts/sht-helper
      - name: Test Sub-Store profile conversion
        run: node --test sub-store/*.test.mjs
      - name: Validate generated proxy rules
        working-directory: proxy-rules
        run: npm run check
      - name: Check Bash syntax
        run: bash -n debian-ai-workstation/setup.sh linux-server-toolkit/server-toolkit.sh linux-server-toolkit/tests/test_init_safety.sh docker-sandboxes/sbx-manager.sh ghostty/setup.sh ghostty/ssh-terminfo.sh ghostty/tests/setup-test.sh ghostty/tests/ssh-terminfo-test.sh workstation-utils/macos/setup.sh workstation-utils/tests/macos-test.sh mihomo-subscription-manager/setup.sh sing-box/install-node.sh
      - name: Test Mihomo subscription manager
        run: python mihomo-subscription-manager/test_manager.py
      - name: Test sing-box toolkit
        run: python -m unittest discover -s sing-box/tests -v
      - name: Test Linux server toolkit safety
        run: ./linux-server-toolkit/tests/test_init_safety.sh
      - name: Test agent setup scripts
        run: ./agent/test.sh
      - name: Validate shared agent TUI
        run: |
          npm ci
          npm run validate
          git diff --exit-code -- dist
        working-directory: agent/tui
      - name: Test Promptctl
        run: python -m pytest -p no:cacheprovider -q agent/promptctl/tests
      - name: Test Promptctl advanced Claude deployer
        run: python -m pytest agent/promptctl/advanced/claude/tests
      - name: Test Promptctl advanced Codex deployer
        run: python -m pytest -p no:cacheprovider -q agent/promptctl/advanced/codex/tests
      - name: Check zsh kit syntax
        run: |
          zsh -n docker-sandboxes/kits/zsh-shell/files/home/.zshrc
          zsh -n docker-sandboxes/kits/zsh-shell/files/home/.config/sbx-manager/completions/_claude
      - name: Test Ghostty setup
        run: |
          ./ghostty/tests/setup-test.sh
          ./ghostty/tests/ssh-terminfo-test.sh
      - name: Test workstation utility planner
        run: ./workstation-utils/tests/macos-test.sh
      - name: Install Worker tooling
        run: npm ci
        working-directory: workers/cloudflare-vless
      - name: Test Cloudflare VLESS Worker
        run: npm test
        working-directory: workers/cloudflare-vless
      - name: Validate Worker bundle
        run: npm run validate
        working-directory: workers/cloudflare-vless
      - name: Install Toolbox Store tooling
        run: npm ci
        working-directory: workers/toolbox-store
      - name: Validate Toolbox Store Worker and Web UI
        run: npm run validate
        working-directory: workers/toolbox-store

  validate-windows:
    name: Windows · portable controllers and Git Bash integration
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install pytest
      - name: Install Windows agent test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            choco install jq -y --no-progress
          }
          bash --version
          jq --version
      - name: Test portable controller backends on Windows
        shell: bash
        run: |
          node --test \
            agent/platform-command.test.mjs \
            agent/platform-paths.test.mjs \
            agent/remote-store.test.mjs \
            agent/mcpctl/import-client.test.mjs \
            agent/mcpctl/remote-client.test.mjs \
            agent/promptctl/prompt-remote.test.mjs \
            agent/agentctl/workspace-client.test.mjs \
            agent/agentctl/provider-client.test.mjs \
            agent/agentctl/account-client.test.mjs \
            agent/agentctl/provider-renderer.test.mjs \
            agent/agentctl/failover-client.test.mjs \
            agent/agentctl/proxy-client.test.mjs \
            agent/agentctl/pricing-client.test.mjs \
            agent/agentctl/proxy-observability.test.mjs
          node agent/skillsctl/test.mjs
          node agent/agentctl/orchestrator-client.test.mjs
      - name: Test controller entrypoints through Git Bash on Windows
        shell: bash
        run: ./agent/tests/windows-git-bash-smoke.sh
      - name: Test native PowerShell controller installer
        shell: powershell
        run: ./agent/tests/install-commands-powershell-test.ps1
      - name: Test Promptctl on Windows
        run: python -m pytest -p no:cacheprovider -q agent/promptctl/tests
      - name: Test Promptctl advanced Codex deployer on Windows
        run: python -m pytest -p no:cacheprovider -q agent/promptctl/advanced/codex/tests
      - name: Test portable agent TUI bundle on Windows
        run: |
          node --test agent/tui/test/*.test.mjs
          node agent/tui/dist/toolbox-tui.mjs --help
      - name: Test Sunshine VDD configuration scripts
        shell: pwsh
        run: ./sunshine-vdd-setup/tests/ConfigScripts.Tests.ps1
      - name: Test workstation utilities with Windows PowerShell 5.1
        shell: powershell
        run: ./workstation-utils/tests/windows-test.ps1
      - name: Test Windows PowerShell managers
        shell: pwsh
        run: |
          ./docker-sandboxes/tests/sbx-manager-test.ps1
          ./workstation-utils/tests/windows-test.ps1
          ./windows-dev-setup/tests/windows-dev-setup-test.ps1
          ./windows-dev-setup/tests/wsl-test.ps1

  validate-agent-bash-3:
    name: macOS · system Bash 3.2 agent suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ensure agent test dependencies
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
      - name: Validate shared agent TUI
        run: |
          npm ci
          npm run validate
          git diff --exit-code -- dist
        working-directory: agent/tui
      - name: Test agent controllers with macOS system Bash 3.2
        run: |
          bash_major="$(/bin/bash -c 'printf "%s" "${BASH_VERSINFO[0]}"')"
          test "$bash_major" = "3"
          compat_bin="$(mktemp -d "${RUNNER_TEMP}/script-toolbox-bash3.XXXXXX")"
          ln -s /bin/bash "$compat_bin/bash"
          PATH="$compat_bin:$PATH" /bin/bash ./agent/test.sh
