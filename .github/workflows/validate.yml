name: Validate scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check Bash syntax
        run: bash -n docker-sandboxes/sbx-manager.sh ghostty/setup.sh ghostty/ssh-terminfo.sh ghostty/tests/setup-test.sh ghostty/tests/ssh-terminfo-test.sh
      - name: Test agent setup scripts
        run: ./agent/test.sh
      - name: Check zsh kit syntax
        run: |
          zsh -n docker-sandboxes/kits/zsh-shell/files/home/.zshrc
          zsh -n docker-sandboxes/kits/zsh-shell/files/home/.config/sbx-manager/completions/_claude
      - name: Test Ghostty setup
        run: |
          ./ghostty/tests/setup-test.sh
          ./ghostty/tests/ssh-terminfo-test.sh
      - name: Install Worker tooling
        run: npm ci
        working-directory: workers/cloudflare-vless
      - name: Test Cloudflare VLESS Worker
        run: npm test
        working-directory: workers/cloudflare-vless
      - name: Validate Worker bundle
        run: npm run validate
        working-directory: workers/cloudflare-vless

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Windows PowerShell managers
        shell: pwsh
        run: |
          ./docker-sandboxes/tests/sbx-manager-test.ps1
          ./windows-dev-setup/tests/windows-dev-setup-test.ps1
          ./windows-wsl2/tests/setup-test.ps1
