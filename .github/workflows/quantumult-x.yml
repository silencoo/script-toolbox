name: Validate Quantumult X

on:
  push:
    paths:
      - 'quantumult-x/**'
      - 'proxy-rules/**'
      - '.github/workflows/quantumult-x.yml'
  pull_request:
    paths:
      - 'quantumult-x/**'
      - 'proxy-rules/**'
      - '.github/workflows/quantumult-x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quantumult X UIAction regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test standalone UIActions
        run: node --test quantumult-x/tests/*.test.mjs
      - name: Validate AI routing and generated rule resources
        working-directory: proxy-rules
        run: npm run check
