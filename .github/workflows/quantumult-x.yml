name: Validate Quantumult X

on:
  push:
    paths:
      - 'quantumult-x/**'
      - 'proxy-rules/**'
      - '.github/workflows/quantumult-x.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'quantumult-x/**'
      - 'proxy-rules/**'
      - '.github/workflows/quantumult-x.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quantumult X UIAction regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate Quantumult X and rules
        run: python scripts/validate.py proxy-rules --install
