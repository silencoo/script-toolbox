name: Validate mihomo-console
'on':
  push:
    paths:
      - mihomo-console/**
      - .github/actions/mihomo/**
      - scripts/**
      - .github/workflows/validate-mihomo-console.yml
  pull_request:
    paths:
      - mihomo-console/**
      - .github/actions/mihomo/**
      - scripts/**
      - .github/workflows/validate-mihomo-console.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: ./.github/actions/mihomo
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate mihomo-console
        run: python scripts/validate.py mihomo-console --install --containers
        env:
          MIHOMO_TEST_BINARY: ${{ runner.temp }}/mihomo
