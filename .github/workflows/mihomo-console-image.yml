name: Publish Mihomo Console image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mihomo-console/Dockerfile"
      - "mihomo-console/.dockerignore"
      - "mihomo-console/requirements.txt"
      - "mihomo-console/mihomo_console.py"
      - "mihomo-console/container_runtime.py"
      - "mihomo-console/web_server.py"
      - "mihomo-console/web/**"
      - ".github/workflows/mihomo-console-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Test container-aware manager
        run: |
          python -m pip install -r mihomo-console/requirements.txt
          python -m unittest discover -s mihomo-console -v
          python -m py_compile mihomo-console/container_runtime.py mihomo-console/web_server.py
          NAS_IP=192.0.2.10 docker compose -f mihomo-console/compose.yaml config --quiet
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mihomo-console
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: mihomo-console
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
