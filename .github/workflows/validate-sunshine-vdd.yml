name: Validate sunshine-vdd
'on':
  push:
    paths:
      - sunshine-vdd/**
      - scripts/**
      - .github/workflows/validate-sunshine-vdd.yml
  pull_request:
    paths:
      - sunshine-vdd/**
      - scripts/**
      - .github/workflows/validate-sunshine-vdd.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate sunshine-vdd
        run: python scripts/validate.py sunshine-vdd --install
