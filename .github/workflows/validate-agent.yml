name: Validate agent
'on':
  push:
    paths:
      - agent/**
      - workers/toolbox-store/**
      - scripts/**
      - .github/workflows/validate-agent.yml
  pull_request:
    paths:
      - agent/**
      - workers/toolbox-store/**
      - scripts/**
      - .github/workflows/validate-agent.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - name: Install Windows jq
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      - name: Use macOS system Bash 3.2
        if: runner.os == 'macOS'
        shell: bash
        run: |-
          test "$(/bin/bash -c 'printf "%s" "${BASH_VERSINFO[0]}"')" = 3
          compat_bin="$(mktemp -d "${RUNNER_TEMP}/toolbox-bash3.XXXXXX")"
          ln -s /bin/bash "$compat_bin/bash"
          printf '%s\n' "$compat_bin" >> "$GITHUB_PATH"
          command -v jq >/dev/null || brew install jq
      - name: Validate agent
        run: python scripts/validate.py agent --install
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
