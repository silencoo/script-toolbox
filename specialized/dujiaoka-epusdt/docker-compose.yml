services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dujiaoka
      MYSQL_USER: dujiaoka
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./runtime/sql/dujiaoka-init.sql:/docker-entrypoint-initdb.d/01-dujiaoka.sql:ro
      - ./runtime/sql/epusdt-init.sql:/docker-entrypoint-initdb.d/02-epusdt.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  web:
    image: stilleshan/dujiaoka
    restart: unless-stopped
    environment:
      INSTALL: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${SHOP_PORT:-18080}:80"
    volumes:
      - ./config/dujiaoka.env:/dujiaoka/.env:ro
      - ./uploads:/dujiaoka/public/uploads
      - ./storage:/dujiaoka/storage

  epusdt:
    image: stilleshan/epusdt
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${EPUSDT_PORT:-18081}:8000"
    volumes:
      - ./config/epusdt.env:/app/.env:ro
