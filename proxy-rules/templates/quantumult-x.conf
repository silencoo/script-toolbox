# Full Quantumult X reusable profile template
#
# Setup: replace REPLACE_WITH_YOUR_SUBSCRIPTION_URL in [server_remote] with
# your own subscription URL. Do not commit a profile containing a private URL.

[general]
# Proxy health checking
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
profile_img_url=https://github.githubassets.com/images/modules/site/integrators/google.png

# Network behavior
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
udp_drop_list=443, STUN, QUIC
# udp_whitelist=1-442, 444-65535

# Optional mode switching by mobile network or Wi-Fi SSID
# running_mode_trigger=filter, filter, wifi1:all_direct, wifi2:all_direct

# Subscription/resource conversion and exit-IP information
resource_parser_url=https://raw.githubusercontent.com/silencoo/script-toolbox/main/quantumult-x/resource-parser.js
geo_location_checker=http://ip-api.com/json/?lang=en, https://raw.githubusercontent.com/limbopro/QuantumultX/master/Scripts/IP_API.js

[dns]
no-ipv6
no-system
server=223.5.5.5
server=114.114.114.114
server=119.29.29.29
address=/raw.githubusercontent.com/185.199.110.133

[policy]
# Built-in Quantumult X policies stay lowercase: proxy, direct, and reject.
# Custom policy names use Title Case consistently.
# Policy icons use this repository owner's z-icon collection. Homarr 108 px
# assets are intended for Quantumult X; exact China and QuanX assets come from
# the same collection's general catalog.

# Keep the frequently toggled blocking policy first in the Quantumult X policy
# list. This display order does not change filter matching precedence below.
static=Ad Blocking, reject, direct, img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/adguard-home.png

# Residential nodes are collected once from the primary resource. AI references
# this child policy instead of listing the same nodes again. Keep these three
# related policies together.
# Replace EXCLUDE_KEYWORD1 and EXCLUDE_KEYWORD2 with unwanted node keywords.
static=Residential, proxy, resource-tag-regex=^Primary Subscription$, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:家宽|家庭宽带|住宅|原生|Residential|Resident|ISP|Home|\[(?:res|home|isp|residential)\]), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/home-assistant.png

# Each routing policy can exclude unwanted nodes and include wanted nodes.
# Replace the four placeholders and add more alternatives with |.
static=AI, Residential, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/openai-light.png
static=Gemini, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/google-gemini.png

# Proxy-first policies
static=Google Voice, proxy, direct, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/google-voice.png
static=Global Media, proxy, direct, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/stb-proxy.png
static=YouTube, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/youtube.png
static=Speedtest, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/ookla-speedtest.png
static=AI Models, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/hugging-face.png
static=GitHub, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/github-light.png
static=Docker, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/docker.png
static=Crypto, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/bitcoin.png
static=Telegram, proxy, direct, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/telegram.png
static=X, proxy, direct, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/selfhst/108/x.png
static=TikTok, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/tiktok.png
static=Emby, proxy, direct, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/emby.png

# Direct-first policies stay together near the bottom.
static=Apple, direct, proxy, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/apple-light.png
static=Bilibili, direct, proxy, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/bilibili.png
static=WeChat, direct, proxy, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/wechat.png
static=China Sites, direct, proxy, reject, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/flag/108/China.png
static=PT, direct, proxy, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/homarr/108/qbittorrent.png
static=Final, proxy, direct, Ad Blocking, server-tag-regex=(?i)^(?!.*(?:EXCLUDE_KEYWORD1|EXCLUDE_KEYWORD2)).*(?:INCLUDE_KEYWORD1|INCLUDE_KEYWORD2), img-url=https://raw.githubusercontent.com/silencoo/z-icon/main/icon/proxy-logo/quanx-v2.png

[server_remote]
# Replace only the URL below. The parser accepts common Clash, Surge,
# Shadowrocket, V2Ray, SS/SSR, Trojan, and VLESS subscription formats.
https://REPLACE_WITH_YOUR_SUBSCRIPTION_URL, tag=Primary Subscription, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
# Gemini comes first because Google's official host list contains a few
# YouTube, analytics, and ad hosts that would otherwise be intercepted by
# broader resources below.
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/gemini.list, tag=Gemini, update-interval=172800, opt-parser=false, enabled=true

# Mixed direct/Ad Blocking policies: never add force-policy to this resource.
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/Ads.list, tag=Ad Blocking, update-interval=172800, opt-parser=false, enabled=true

# Keep high-bandwidth YouTube video traffic separate from Global Media. Gemini
# remains above this resource so its shared exact hosts keep one exit IP.
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=YouTube, update-interval=172800, opt-parser=false, enabled=true

# Speedtest must stay above direct and mainland-China fallbacks.
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Speedtest/Speedtest.list, tag=Speedtest, force-policy=Speedtest, update-interval=172800, opt-parser=false, enabled=true

# Model hubs must stay above generic CDN and media resources so model files can
# use an independently selected high-bandwidth route.
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/AIModels.list, tag=AI Models, update-interval=172800, opt-parser=false, enabled=true

# Developer services use local normalized rule sources.
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/GitHub.list, tag=GitHub, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/Docker.list, tag=Docker, update-interval=172800, opt-parser=false, enabled=true

# Other AI providers
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/OpenAI.list, tag=OpenAI, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/Claude.list, tag=Claude, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/OtherAI.list, tag=Perplexity Copilot Grok, update-interval=172800, opt-parser=false, enabled=true

# General compatibility and service routing
https://raw.githubusercontent.com/ddgksf2013/Filter/master/Unbreak.list, tag=Rule Fixes, force-policy=direct, update-interval=172800, opt-parser=true, enabled=true

# Match domestic ByteDance domains before TikTok's shared infrastructure.
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/ByteDance.list, tag=ByteDance, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/TikTok.list, tag=TikTok, update-interval=172800, opt-parser=false, enabled=true

https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=Apple Services, force-policy=Apple, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/sve1r/Rules-For-Quantumult-X/refs/heads/main/Rules/Services/SNS/Twitter.list, tag=X Platforms, force-policy=X, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/WeChat/WeChat.list, tag=WeChat, force-policy=WeChat, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Filter/master/GoogleVoice.list, tag=Google Voice, force-policy=Google Voice, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Filter/master/StreamingSE.list, tag=Bilibili, force-policy=Bilibili, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list, tag=China Sites, force-policy=China Sites, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Filter/master/Streaming.list, tag=Global Media, force-policy=Global Media, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/sve1r/Rules-For-Quantumult-X/refs/heads/main/Rules/Services/SNS/Telegram.list, tag=Telegram, force-policy=Telegram, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/silencoo/script-toolbox/main/proxy-rules/rules/quantumultx/PT.list, tag=Private Trackers, update-interval=172800, opt-parser=false, enabled=true

# Deliberately disabled: its broad Google suffixes overlap Drive and the
# isolated Gemini policy above.
https://ddgksf2013.top/filter/Ai.yaml, tag=AI All-in-One (Disabled), force-policy=AI, update-interval=172800, opt-parser=true, enabled=false

[rewrite_remote]

