"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 1200
scan_timeout = 30
format = "$env_var.IS_SANDBOX$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$docker_context$fill$cmd_duration$status$line_break$character"

[env_var.IS_SANDBOX]
format = "[sbx](bold yellow) "

[username]
format = "[$user]($style)@"
style_user = "bold green"
style_root = "bold red"
show_always = false

[hostname]
format = "[$hostname](bold green) "
ssh_only = true

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = false
read_only = " ro"

[git_branch]
symbol = "git:"
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
symbol = "node "
format = "via [$symbol($version)]($style) "

[python]
symbol = "py "
format = "via [$symbol${pyenv_prefix}(${version})(\\($virtualenv\\))]($style) "

[rust]
symbol = "rs "
format = "via [$symbol($version)]($style) "

[golang]
symbol = "go "
format = "via [$symbol($version)]($style) "

[docker_context]
symbol = "docker "
format = "via [$symbol$context]($style) "
only_with_files = true

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
format = "took [$duration](bold yellow) "

[status]
disabled = false
format = "[$status](bold red) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
